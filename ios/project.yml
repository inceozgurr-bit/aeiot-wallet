name: AEIOTWallet
options:
  bundleIdPrefix: aeiot
  deploymentTarget:
    iOS: "26.0"
  # English is the base language, so any device that is not Turkish gets English.
  developmentLanguage: en
packages:
  web3swift:
    url: https://github.com/web3swift-team/web3swift
    from: 3.3.0
  reown:
    url: https://github.com/reown-com/reown-swift
    # Pinned exactly: a future release could add a transitive dependency that
    # collides with web3swift's secp256k1/CryptoSwift. Bump deliberately.
    exactVersion: 2.3.1
targets:
  AEIOTWallet:
    type: application
    platform: iOS
    sources: [AEIOTWallet]
    # Holds REOWN_PROJECT_ID. Not in git; see CLAUDE.md to recreate.
    configFiles:
      Debug: Secrets.xcconfig
      Release: Secrets.xcconfig
    entitlements:
      path: AEIOTWallet/AEIOTWallet.entitlements
      properties:
        # Reown's SDK writes its own keychain items into this access group and
        # has no fallback if it is missing.
        com.apple.security.application-groups:
          - group.aeiot.app001
    info:
      path: AEIOTWallet/Info.plist
      properties:
        # Black background with the mark centred — Apple's own key names.
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        # Read at launch by WalletConnectService; substituted from Secrets.xcconfig.
        ReownProjectID: $(REOWN_PROJECT_ID)
        # Lets a dapp hand control back to this app after a signature.
        CFBundleURLTypes:
          - CFBundleURLName: aeiot.app001
            CFBundleURLSchemes: [aeiot]
    dependencies:
      - package: web3swift
      - package: reown
        product: ReownWalletKit
    settings:
      base:
        # Must stay identical to the Bundle ID registered in App Store Connect
        # (app Apple ID 6799625313) — a mismatch rejects the upload.
        PRODUCT_BUNDLE_IDENTIFIER: aeiot.app001
        # Home screen and App Store name; without it the target name
        # ("AEIOTWallet") shows under the icon.
        INFOPLIST_KEY_CFBundleDisplayName: AEIOT
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: JMLSCK7G9U
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDevelopmentRegion: en
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSFaceIDUsageDescription: Face ID protects your wallet and confirms transactions.
        INFOPLIST_KEY_NSCameraUsageDescription: The camera is used to scan recipient QR codes.
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.10"
